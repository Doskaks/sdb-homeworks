version: '3.7'
services:
  elasticsearch:
    image: elasticsearch:7.17.9
    environment:
      - discovery.type=single-node
    ports: ["9200:9200"]

  kibana:
    image: kibana:7.17.9
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["5601:5601"]

  nginx:
    image: nginx:alpine
    ports: ["8080:80"]

  filebeat:
    image: docker.elastic.co/beats/filebeat:7.17.9
    command: >
      sh -c "
      echo '192.168.1.100 - - [27/Dec/2024:10:00:00 +0000] \"GET / HTTP/1.1\" 200 1024' > /tmp/nginx.log &&
      echo '192.168.1.101 - - [27/Dec/2024:10:00:01 +0000] \"GET /test HTTP/1.1\" 404 157' >> /tmp/nginx.log &&
      filebeat -e -E output.elasticsearch.hosts=['elasticsearch:9200'] -E 'filebeat.inputs=[{type: log, paths: [/tmp/nginx.log]}]'
      "